<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>OmniBox · 登录</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d; --text:#e6edf3; --text2:#8b949e; --accent:#f78166; --accent2:#d29922; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card {
    width:100%; max-width:360px;
    background: var(--bg2);
    border:1px solid var(--border);
    border-radius:16px;
    padding:32px 28px;
  }
  .logo { display:flex; flex-direction:column; align-items:center; gap:12px; margin-bottom:24px; }
  .logo img { width:72px; height:72px; border-radius:18px; }
  .logo h1 { font-size:20px; font-weight:700; }
  .logo p { font-size:13px; color:var(--text2); }
  label { display:block; font-size:13px; color:var(--text2); margin:0 0 6px 2px; }
  input[type=password] {
    width:100%; padding:11px 14px;
    background:var(--bg); border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-size:15px; outline:none;
    transition:border-color .15s;
  }
  input[type=password]:focus { border-color:var(--accent); }
  button {
    width:100%; margin-top:16px; padding:12px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#1a1a1a; font-weight:600; font-size:15px;
    border:none; border-radius:10px; cursor:pointer;
  }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .msg { min-height:18px; margin-top:12px; font-size:13px; text-align:center; }
  .msg.err { color:#f85149; }
  .msg.ok  { color:#3fb950; }
</style>
</head>
<body>
<main class="card">
  <div class="logo">
    <img src="/icon-192.png" alt="OmniBox">
    <h1>OmniBox</h1>
    <p>访问需要输入访问密码</p>
  </div>
  <form id="f" onsubmit="return doLogin()">
    <label for="pw">访问密码</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus>
    <button id="btn" type="submit">登 录</button>
  </form>
  <div class="msg" id="msg"></div>
</main>
<script>
const msg = document.getElementById('msg');
const btn = document.getElementById('btn');
const pw  = document.getElementById('pw');

function doLogin() {
  const v = pw.value;
  if (!v) { show('请输入密码', 'err'); return false; }
  btn.disabled = true;
  show('验证中…', '');
  fetch('/api/login', {
    method: 'POST',
    headers: {'content-type': 'application/json'},
    body: JSON.stringify({password: v})
  }).then(r => r.json()).then(d => {
    if (d.ok) {
      show('登录成功，正在跳转…', 'ok');
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
    } else if (d.locked) {
      show('尝试次数过多，已锁定 ' + d.locked + ' 秒', 'err');
      btn.disabled = false;
    } else {
      show(d.error || '密码错误', 'err');
      btn.disabled = false;
      pw.select();
    }
  }).catch(() => {
    show('网络错误，请重试', 'err');
    btn.disabled = false;
  });
  return false;
}

function show(t, cls) { msg.textContent = t; msg.className = 'msg' + (cls ? ' ' + cls : ''); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>OmniBox · 搜索</title>
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>
<header>
  <div class="logo" onclick="location.href='/'" style="cursor:pointer">OmniBox<span>搜索 · 多源</span></div>
  <div class="search-box">
    <input id="kw" placeholder="搜索影视名称" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
  </div>
</header>
<main>
  <div class="filter-row" id="src-row" style="margin-bottom:10px">
    <span class="label">来源</span>
    <span class="chip active" data-src="all" onclick="switchSrc('all')">全部</span>
  </div>
  <div class="page-title" id="title"></div>
  <div class="grid" id="grid"></div>
  <div class="loading" id="loading">搜索中…</div>
  <div class="pager" id="pager" style="display:none">
    <button id="prev" onclick="go(-1)">上一页</button>
    <button id="next" onclick="go(1)">下一页</button>
  </div>
</main>

<script>
let page = 1, pagecount = 1, curSrc = 'all';
let SRC_NAMES = {};

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function loadSources(){
  const r = await fetch('/api/spiders').then(x=>x.json()).catch(()=>null);
  const list = (r && r.list) || [];
  SRC_NAMES = { all: '全部源' };
  list.forEach(s => { SRC_NAMES[s.id] = s.display_name || s.name || s.id; });
  const row = document.getElementById('src-row');
  list.forEach(s => {
    const el = document.createElement('span');
    el.className = 'chip';
    el.dataset.src = s.id;
    el.textContent = s.display_name || s.name || s.id;
    el.onclick = () => switchSrc(s.id);
    row.appendChild(el);
  });
  const p = new URLSearchParams(location.search);
  if (p.get('src')) {
    curSrc = p.get('src');
    document.querySelectorAll('#src-row .chip').forEach(el => el.classList.toggle('active', el.dataset.src === curSrc));
  }
  if (!list.length) {
    row.insertAdjacentHTML('beforeend', '<span class="hint" style="margin-left:6px">未导入脚本 · <a href="/spiders.html" style="color:var(--accent)">去导入</a></span>');
  }
}

function switchSrc(s) {
  curSrc = s;
  document.querySelectorAll('#src-row .chip').forEach(el => el.classList.toggle('active', el.dataset.src === s));
  const q = document.getElementById('kw').value.trim();
  if (q) load(q, 1);
}
function doSearch() {
  const q = document.getElementById('kw').value.trim();
  if (q) location.href = '/search.html?q=' + encodeURIComponent(q) + '&src=' + curSrc;
}
function go(d) {
  page = Math.min(Math.max(page + d, 1), pagecount);
  const p = new URLSearchParams(location.search);
  load(p.get('q') || '', page); window.scrollTo(0, 0);
}

async function load(q, p) {
  const loading = document.getElementById('loading');
  const grid = document.getElementById('grid');
  loading.style.display = 'block';
  grid.innerHTML = '';
  const srcLabel = SRC_NAMES[curSrc] || curSrc;
  document.getElementById('title').innerHTML = `“<em>${esc(q)}</em>” 的搜索结果（${esc(srcLabel)}）`;
  const r = await fetch(`/api/vod/search?src=${curSrc}&wd=${encodeURIComponent(q)}&page=${p}`).then(x => x.json()).catch(() => null);
  loading.style.display = 'none';
  if (!r || r.ok === false) {
    const err = (r && r.error) || '网络错误';
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(err)}${err.includes('脚本')||err.includes('导入')?' · <a href="/spiders.html" style="color:var(--accent)">去脚本管理</a>':''}</div>`;
    return;
  }
  if (r.errors && r.errors.length && curSrc === 'all') {
    grid.innerHTML += `<div class="empty" style="grid-column:1/-1;opacity:.7">部分源失败：${esc(r.errors.join('；'))}</div>`;
  }
  pagecount = r.pagecount || 1;
  const list = r.list || [];
  if (!list.length) { grid.innerHTML = '<div class="empty" style="grid-column:1/-1">没有找到相关结果</div>'; document.getElementById('pager').style.display = 'none'; return; }
  grid.innerHTML = list.map(v => {
    const src = v.source || '';
    const tag = SRC_NAMES[src] || src;
    return `
    <div class="card" onclick="location.href='/play.html?src=${encodeURIComponent(src)}&id=${encodeURIComponent(v.vod_id)}'">
      <div class="poster">
        <img loading="lazy" src="/api/img?url=${encodeURIComponent(v.vod_pic)}" alt="" onerror="this.style.visibility='hidden'">
        <span class="remarks">${esc(v.vod_remarks)}</span>
        <span class="score" style="top:4px;right:4px;background:#2563eb">${esc(tag)}</span>
      </div>
      <div class="title" title="${esc(v.vod_name)}">${esc(v.vod_name)}</div>
    </div>`;
  }).join('');
  document.getElementById('pager').style.display = 'flex';
  document.getElementById('prev').disabled = p <= 1;
  document.getElementById('next').disabled = p >= pagecount;
}

(async function init(){
  const params = new URLSearchParams(location.search);
  const q = (params.get('q') || '').trim();
  if (q) document.getElementById('kw').value = q;
  await loadSources();
  if (q) {
    const p = Math.max(1, parseInt(params.get('page') || '1', 10) || 1);
    page = p;
    load(q, p);
  } else {
    document.getElementById('loading').style.display = 'none';
  }
})();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{})); }
</script>
</body>
</html>

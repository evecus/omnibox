<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniBox · 播放</title>
<link rel="stylesheet" href="/app.css">
<script src="/hls.min.js"></script>
<link rel="manifest" href="/manifest.json">
</head>
<body>
<header>
  <div class="logo" onclick="location.href='/'" style="cursor:pointer">OmniBox<span>播放</span></div>
  <div class="search-box">
    <input id="kw" placeholder="搜索影视名称" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button>
    <button class="source-btn" onclick="location.href='/spiders.html'" title="源管理">源管理</button>
    <button class="source-btn" onclick="location.href='/history.html'" title="播放历史">历史</button>
  </div>
</header>
<main>
  <!-- 阶段1：从豆瓣片名匹配影视 -->
  <div id="pick" style="display:none">
    <div class="page-title" id="pick-title"></div>
    <div class="grid" id="pick-grid"></div>
    <div class="loading" id="pick-loading">正在多源搜索…</div>
  </div>

  <!-- 阶段2：详情 + 播放 -->
  <div id="player-view" style="display:none">
    <div class="play-wrap">
      <div>
        <div class="player-box" id="player-box">
          <video id="video" controls playsinline></video>
        </div>
        <div class="res-row" id="res-row"></div>
        <div class="panel" style="margin-top:14px">
          <h3 id="v-name"></h3>
          <div class="meta-grid" id="v-meta"></div>
          <div class="vod-content" id="v-content"></div>
        </div>
      </div>
      <div class="side-panel">
        <div class="panel">
          <h3>选集</h3>
          <div class="ep-list" id="ep-list"></div>
        </div>
        <div class="panel">
          <h3>海报</h3>
          <img id="v-pic" style="width:100%;border-radius:8px" alt="">
        </div>
      </div>
    </div>
  </div>
</main>

<script>
function doSearch() {
  const q = document.getElementById('kw').value.trim();
  if (q) location.href = '/search.html?q=' + encodeURIComponent(q);
}
function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const qs = new URLSearchParams(location.search);
let vodId = qs.get('id') || '';
let curSrc = qs.get('src') || '';
const searchName = qs.get('q') || '';
let SRC_NAMES = {};
let hls = null;

async function loadSources(){
  const r = await fetch('/api/spiders').then(x=>x.json()).catch(()=>null);
  SRC_NAMES = {};
  ((r && r.list) || []).forEach(s => { SRC_NAMES[s.id] = s.display_name || s.name || s.id; });
}

async function init() {
  await loadSources();
  if (vodId) { loadDetail(); return; }
  if (searchName) {
    // 豆瓣入口：聚合搜索全部脚本让用户挑选
    document.getElementById('pick').style.display = 'block';
    document.getElementById('pick-title').innerHTML = `“<em>${esc(searchName)}</em>” 的多源匹配`;
    const r = await fetch(`/api/vod/search?src=all&wd=${encodeURIComponent(searchName)}`).then(x => x.json()).catch(() => null);
    document.getElementById('pick-loading').style.display = 'none';
    const list = (r && r.list) || [];
    if (!list.length) {
      document.getElementById('pick-grid').innerHTML = '<div class="empty" style="grid-column:1/-1">全部源均未找到该片 · <a href="/spiders.html" style="color:var(--accent)">检查脚本</a></div>';
      return;
    }
    document.getElementById('pick-grid').innerHTML = list.map(v => {
      const src = v.source || '';
      const tag = SRC_NAMES[src] || src;
      return `
      <div class="card" onclick="location.href='/play.html?src=${encodeURIComponent(src)}&id=${encodeURIComponent(v.vod_id)}'">
        <div class="poster">
          <img loading="lazy" src="/api/img?url=${encodeURIComponent(v.vod_pic)}" onerror="this.style.visibility='hidden'">
          <span class="remarks">${esc(v.vod_remarks)}</span>
          <span class="score" style="top:4px;right:4px;background:#2563eb">${esc(tag)}</span>
        </div>
        <div class="title">${esc(v.vod_name)}</div>
      </div>`;
    }).join('');
  }
}

let episodes = [], curEp = 0;

async function loadDetail() {
  document.getElementById('player-view').style.display = 'block';
  document.querySelector('.logo span').textContent = '播放 · ' + (SRC_NAMES[curSrc] || curSrc || '源');
  const url = `/api/vod/detail?src=${encodeURIComponent(curSrc)}&id=${encodeURIComponent(vodId)}`;
  const r = await fetch(url).then(x => x.json()).catch(() => null);
  if (!r || r.error) {
    document.getElementById('v-name').textContent = '详情加载失败';
    document.getElementById('v-content').textContent = r ? JSON.stringify(r, null, 2) : '网络请求失败（fetch 异常）';
    console.error('detail raw:', r);
    return;
  }
  const v = r.vod;
  episodes = r.episodes || [];
  document.title = v.vod_name + ' · OmniBox';
  document.getElementById('v-name').textContent = v.vod_name;
  document.getElementById('v-meta').innerHTML =
    `<b>年份</b> ${esc(v.vod_year) || '—'} &nbsp; <b>地区</b> ${esc(v.vod_area) || '—'}<br>
     <b>导演</b> ${esc(v.vod_director) || '—'}<br>
     <b>主演</b> ${esc(v.vod_actor) || '—'}`;
  document.getElementById('v-content').textContent = v.vod_content || '';
  document.getElementById('v-pic').src = '/api/img?url=' + encodeURIComponent(v.vod_pic);
  // 记录播放历史（进入详情即记录，集数在 playEp 里更新）
  recordHistory(0, episodes[0] ? episodes[0].name : '');

  const epList = document.getElementById('ep-list');
  epList.innerHTML = episodes.map((e, i) =>
    `<span class="ep" data-i="${i}" onclick="playEp(${i})">${esc(e.name)}</span>`).join('');
  if (episodes.length) playEp(0);
}

async function playEp(i) {
  curEp = i;
  document.querySelectorAll('.ep').forEach(el => el.classList.toggle('active', +el.dataset.i === i));
  const ep = episodes[i];
  const video = document.getElementById('video');
  video.innerHTML = '';
  video.poster = '';
  video.src = '';
  const r = await fetch(`/api/vod/play?src=${encodeURIComponent(curSrc)}&q=${encodeURIComponent(ep.q || '')}`).then(x => x.json()).catch(() => null);
  if (!r || r.error || !r.url) {
    const msg = (r && r.error) ? r.error : (r ? '脚本未返回播放地址' : '网络请求失败');
    document.getElementById('player-box').innerHTML = `<div class="empty" style="padding:40px">取播放地址失败：${esc(msg)}<br><small style="opacity:.6">可到脚本管理页点「测试」查看脚本返回</small></div>`;
    console.error('play raw:', r);
    return;
  }
  recordHistory(i, ep ? ep.name : '');
  startPlay(r.url, r.header);
}

// 记录/更新播放历史（失败不影响播放）
function recordHistory(epIndex, epName) {
  if (!vodId || !curSrc) return;
  const titleEl = document.getElementById('v-name');
  const name = titleEl ? titleEl.textContent : '';
  const picEl = document.getElementById('v-pic');
  const pic = picEl ? (picEl.src.split('/api/img?url=')[1] || '') : '';
  const p = new URLSearchParams();
  p.set('src', curSrc); p.set('id', vodId); p.set('name', name);
  p.set('pic', decodeURIComponent(pic)); p.set('ep', String(epIndex)); p.set('epname', epName || '');
  fetch('/api/history/add?' + p.toString()).catch(()=>{});
}

function startPlay(url, header) {
  const video = document.getElementById('video');
  destroyHls();
  const h = header || {};
  let proxied = '/api/stream?url=' + encodeURIComponent(url);
  if (h['User-Agent']) proxied += '&ua=' + encodeURIComponent(h['User-Agent']);
  if (h['Referer']) proxied += '&referer=' + encodeURIComponent(h['Referer']);
  if (h['Origin']) proxied += '&origin=' + encodeURIComponent(h['Origin']);
  else if (h['Referer']) {
    try { proxied += '&origin=' + encodeURIComponent(new URL(h['Referer']).origin); } catch(e){}
  }
  if (url.includes('.m3u8')) {
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ maxBufferLength: 30 });
      hls.loadSource(proxied);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (data.fatal) { destroyHls(); video.src = proxied; }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = proxied;
    } else {
      document.getElementById('player-box').innerHTML = '<div class="empty">当前浏览器不支持 HLS 播放</div>';
    }
  } else {
    video.src = proxied;
  }
  video.play().catch(() => {});
}

function destroyHls() { if (hls) { hls.destroy(); hls = null; } }

init();
</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{})); }
</script>
</body>
</html>

[package]
name = "omnibox"
version = "0.1.0"
edition = "2021"
description = "纯 Rust 影视站：豆瓣首页 + QuickJS 动态脚本源，内置网页面板"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
urlencoding = "2"
anyhow = "1"
futures = "0.3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
rand = "0.8"
rquickjs = { version = "0.14", features = ["full-async", "parallel"] }
scraper = { version = "0.29", features = ["atomic", "deterministic"] }
ego-tree = "0.11.1"

[profile.release]
opt-level = 2
strip = true
panic = "abort"
debug = false
